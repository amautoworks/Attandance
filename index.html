<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send Current Location</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:28px 18px;text-align:center;background:#f7f7f7;color:#222}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}
button{font-size:18px;padding:14px 22px;border:0;border-radius:12px;cursor:pointer}
#send{display:none;background:#25D366;color:#fff;width:100%}
#status{margin:22px 0;line-height:1.6}
.info{text-align:left;background:#f1f3f5;border-radius:12px;padding:14px;margin:16px 0;display:none}
.info div{margin:6px 0}
</style>
</head>
<body>
<div class="card">
<h2>📍 Attendance Location</h2>
<p id="status">📡 Current location प्राप्त की जा रही है…</p>
<div class="info" id="info">
<div><b>📍 Place:</b> <span id="place">Finding…</span></div>
<div><b>🌐 Latitude:</b> <span id="lat">-</span></div>
<div><b>🌐 Longitude:</b> <span id="lon">-</span></div>
<div><b>🕐 Time:</b> <span id="time">-</span></div>
</div>
<button id="send">📲 WhatsApp पर Send करें</button>
</div>
<script>
const WHATSAPP_NUMBER="919616400422";
const statusEl=document.getElementById("status"),sendBtn=document.getElementById("send");
const info=document.getElementById("info"),placeEl=document.getElementById("place");
const latEl=document.getElementById("lat"),lonEl=document.getElementById("lon"),timeEl=document.getElementById("time");
let waUrl="";
function pad(n){return String(n).padStart(2,"0")}
function getTime(){const d=new Date();return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
async function getPlace(lat,lon){
 try{
  const u=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&localityLanguage=en`;
  const r=await fetch(u); if(!r.ok) throw new Error();
  const d=await r.json();
  const a=[d.locality,d.city,d.principalSubdivision,d.countryName].filter(Boolean);
  return [...new Set(a)].join(", ")||"Place not available";
 }catch(e){return "Place not available"}
}
function locate(){
 if(!navigator.geolocation){statusEl.textContent="❌ This browser does not support GPS location.";return}
 statusEl.textContent="📡 Getting your current GPS location…";
 navigator.geolocation.getCurrentPosition(async pos=>{
  const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6),time=getTime();
  latEl.textContent=lat;lonEl.textContent=lon;timeEl.textContent=time;info.style.display="block";
  statusEl.textContent="🔎 Place पता किया जा रहा है…";
  const place=await getPlace(lat,lon);placeEl.textContent=place;
  const map=`https://maps.google.com/?q=${lat},${lon}`;
  const msg=`📍 ATTENDANCE LOCATION\n\n🏠 Place: ${place}\n🌐 Latitude: ${lat}\n🌐 Longitude: ${lon}\n🕐 Time: ${time}\n\n📌 Google Maps:\n${map}`;
  waUrl=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  statusEl.textContent="✅ Location और place मिल गया";
  sendBtn.style.display="block";
 },err=>{
  statusEl.textContent=err.code===1?"❌ Location permission denied. Browser में Location Allow करें और फिर page खोलें.":err.code===2?"❌ Location उपलब्ध नहीं है. GPS/Location ON करके फिर कोशिश करें.":"❌ Location लेने में समय लग गया. फिर से कोशिश करें.";
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
sendBtn.onclick=()=>{if(waUrl) window.location.href=waUrl};
locate();
</script>
</body>
</html>
