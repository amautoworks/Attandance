<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Location</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:auto;padding:20px;background:#f5f5f5;color:#222}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 18px #0001}
h2{margin-top:0} .row{margin:10px 0;line-height:1.45}
.label{font-weight:700} button{display:none;width:100%;padding:15px;border:0;border-radius:12px;background:#25D366;color:#fff;font-size:18px}
#status{text-align:center;margin:18px 0}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>📍 Attendance</h2>
<div id="status">📡 Current location प्राप्त की जा रही है…</div>
<div id="details" style="display:none">
  <div class="row"><span class="label">🏢 Place:</span> <span id="place">-</span></div>
  <div class="row"><span class="label">📌 Address:</span> <span id="address">-</span></div>
  <div class="row"><span class="label">🌐 Latitude:</span> <span id="lat">-</span></div>
  <div class="row"><span class="label">🌐 Longitude:</span> <span id="lon">-</span></div>
  <div class="row"><span class="label">🕐 Time:</span> <span id="time">-</span></div>
  <p class="small">Place/address OpenStreetMap data से लिया जा रहा है. Company/business का नाम तभी मिलेगा जब map database में उपलब्ध हो.</p>
</div>
<button id="send">📲 WhatsApp पर Send करें</button>
</div>

<script>
const WA_NUMBER="919616400422";
let waUrl="";

const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,"0")}
function now(){
 const d=new Date();
 return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function reverseGeocode(lat,lon){
 const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
 const r=await fetch(url,{headers:{"Accept":"application/json"}});
 if(!r.ok) throw new Error("Address lookup failed");
 return await r.json();
}

function pickPlace(a){
 return a.amenity || a.shop || a.office || a.company ||
        a.building || a.commercial || a.tourism ||
        a.industrial || a.leisure || a.road || "Nearby location";
}

function makeAddress(a,display){
 const parts=[
   a.house_number ? `${a.house_number} ${a.road||""}`.trim() : a.road,
   a.neighbourhood || a.suburb,
   a.city_district,
   a.city || a.town || a.village,
   a.state_district,
   a.state,
   a.postcode
 ].filter(Boolean);
 return [...new Set(parts)].join(", ") || display || "Address not available";
}

async function start(){
 if(!navigator.geolocation){
   $("status").textContent="❌ इस browser में GPS उपलब्ध नहीं है.";
   return;
 }
 $("status").textContent="📡 GPS location ली जा रही है…";

 navigator.geolocation.getCurrentPosition(async pos=>{
   const lat=pos.coords.latitude.toFixed(6);
   const lon=pos.coords.longitude.toFixed(6);
   const time=now();

   $("lat").textContent=lat;
   $("lon").textContent=lon;
   $("time").textContent=time;
   $("details").style.display="block";

   try{
     $("status").textContent="🔎 आसपास का place और local address खोज रहे हैं…";
     const data=await reverseGeocode(lat,lon);
     const a=data.address||{};
     const place=pickPlace(a);
     const address=makeAddress(a,data.display_name);

     $("place").textContent=place;
     $("address").textContent=address;
     $("status").textContent="✅ Location तैयार है";

     const map=`https://www.google.com/maps?q=${lat},${lon}`;
     const msg=
`📍 ATTENDANCE LOCATION

🏢 Place: ${place}
📌 Address: ${address}

🌐 Latitude: ${lat}
🌐 Longitude: ${lon}
🕐 Time: ${time}

🗺️ Google Maps:
${map}`;

     waUrl=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
     $("send").style.display="block";
   }catch(e){
     $("status").textContent="⚠️ GPS मिल गया, लेकिन local address/place नहीं मिल पाया.";
     const map=`https://www.google.com/maps?q=${lat},${lon}`;
     const msg=`📍 ATTENDANCE LOCATION

📌 Address: Location lookup unavailable
🌐 Latitude: ${lat}
🌐 Longitude: ${lon}
🕐 Time: ${time}

🗺️ Google Maps:
${map}`;
     waUrl=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
     $("send").style.display="block";
   }
 },err=>{
   $("status").textContent=
     err.code===1 ? "❌ Location permission denied. Browser में Location = Allow करें."
     : err.code===2 ? "❌ GPS location नहीं मिली. Phone का Location ON करें."
     : "❌ GPS लेने में timeout हुआ. फिर से कोशिश करें.";
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

$("send").onclick=()=>{if(waUrl) location.href=waUrl};
start();
</script>
</body>
</html>
